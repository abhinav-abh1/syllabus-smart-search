{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/upload.css' %}">

<div class="upload-wrapper">
    <div class="upload-card">
        <h2>Upload Textbook PDF</h2>
        <p class="subtitle">
            Upload your textbook to enable smart syllabus-based search
        </p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label>Book Title</label>
                <input
                    type="text"
                    name="title"
                    placeholder="Enter textbook name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Select PDF File</label>
                <input
                    type="file"
                    name="pdf_file"
                    accept=".pdf"
                    required
                >
            </div>

            <button type="submit" class="upload-btn">
                Upload & Process PDF
            </button>
        </form>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="message {{ message.tags }}">
                        {{ message }}
                    </p>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
